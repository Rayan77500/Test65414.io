// Aucune dependance externe : Android "nu", sans AndroidX ni services Google.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rayan.w204dash'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rayan.w204dash'
        minSdk 16
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    signingConfigs {
        // meme cle que build.sh : les mises a jour s'installent par-dessus
        debug {
            storeFile rootProject.file('tools/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
